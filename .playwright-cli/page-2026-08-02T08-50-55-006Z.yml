    - generic [ref=e79]:
      - heading "💬 進階版：「歌來囉 ♫」直接住進家庭 LINE 群組" [level=2] [ref=e80]:
        - generic [ref=e81]: 💬
        - text: 進階版：「歌來囉 ♫」直接住進家庭 LINE 群組
      - generic [ref=e82]: LINE 機器人已上線
      - paragraph [ref=e83]: 手機網頁已經只剩三個動作，但我後來又想到一件事。
      - paragraph [ref=e84]: 家人每天本來就會打開 LINE，為什麼還要另外記一個網址？
      - paragraph [ref=e85]: 所以，我又把「歌來囉 ♫」往前推了一步，直接做成家庭 LINE 群組裡的機器人。
      - list [ref=e86]:
        - listitem [ref=e87]: 🔗授權的家人在群組貼上一支 YouTube 網址
        - listitem [ref=e88]: 📨機器人立刻回覆「收到囉」，讓人知道工作已經進站
        - listitem [ref=e89]: 🖥️Mac mini 自動下載、轉檔，再把影片送回原本的 LINE 群組
        - listitem [ref=e90]: 🎵MP4 保留原本歌名，不再出現看不懂的 Song 4
      - paragraph [ref=e91]: 這裡還藏了幾個家庭版的小規矩：目前只有我和兩位家庭成員可以啟動；一般聊天、貼圖、照片和其他網址全部忽略；只有 YouTube 網址會讓它開工。
      - generic [ref=e92]:
        - generic [ref=e93]:
          - generic [ref=e94]: 只在對的群組工作
          - text: 綁定家庭群組與指定成員，其他地方貼網址也不理。
        - generic [ref=e95]:
          - generic [ref=e96]: 先回收件訊號
          - text: 不用盯著畫面猜，到站就先說「收到囉」。
        - generic [ref=e97]:
          - generic [ref=e98]: 原歌名交付
          - text: 完成訊息、下載連結與 MP4 都保留歌曲名稱。
        - generic [ref=e99]:
          - generic [ref=e100]: 24 小時自動清理
          - text: 影片暫存在家裡的 Mac mini，隔天自動刪除。
      - paragraph [ref=e101]: 做到雲端影片空間時，平台要求先綁信用卡。畫面寫著基本月費是零，但超過免費額度仍會計費。我不想為家庭小工具留下一張不知道什麼時候會跳出來的帳單，所以沒有綁。
      - paragraph [ref=e102]: 最後改成：Cloudflare 只負責收件和排隊，影片留在家裡全天開機的 Mac mini，再用加密網址暫時交付。省下雲端儲存帳單，也保留原本的 24 小時清理規則。
      - generic [ref=e103]: 原本以為三步已經夠簡單，後來才發現，最好的入口就是家人原本每天已經在用的那個地方。
