        - generic [ref=e60]:
          - generic [ref=e61]: "3"
          - generic [ref=e62]:
            - text: 成品自己進 Drive
            - generic [ref=e63]: 同名 MP3＋TXT，直接躺進「緣聚」資料夾等我們去拿。
      - paragraph [ref=e64]: 第一版完成時，音檔可以播放、長度正確、320 kbps，看起來每一項都綠燈。
      - paragraph [ref=e65]: 結果我一聽，前面還有人聲😳
      - paragraph [ref=e66]: 這就是 AI 最容易犯的毛病：技術檢查全過，就很想說「完成了」。後來我們把模型升級，整首重跑。這次老公實際拿去唱，對去人聲效果非常滿意。
      - paragraph [ref=e67]: 但是他也立刻聽出來，有幾句字幕沒有踩得那麼準。
      - paragraph [ref=e68]: 很好，這才叫真的驗收。不是程式說 completed，是使用的人真的唱過。
