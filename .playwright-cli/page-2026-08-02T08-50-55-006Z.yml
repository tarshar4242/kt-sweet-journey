        - text: 一天做兩個工具，起因其實一點都不科技
      - paragraph [ref=e18]: 一個是爸爸。
      - paragraph [ref=e19]: 他喜歡看歌曲影片，可是每次要把 YouTube 影片放進手機，步驟一多就記不住。偏偏我又沒有跟他住在一起，不可能三不五時衝去他家，站在旁邊重新教一次。
      - paragraph [ref=e20]: 另一個是老公。
      - paragraph [ref=e21]: 他喜歡在家裡的音樂室唱歌。以前做一首伴唱底板，要去人聲、聽唱詞、對秒數、打字幕，一首歌弄掉幾個小時，很正常。
      - paragraph [ref=e22]: 我這個人就是這樣。
      - paragraph [ref=e23]: 同一件麻煩只要重複出現幾次，我就會開始忍不住想：
      - generic [ref=e24]: 到底為什麼還要一直手動？這些步驟，不能全部丟給 Mac mini 嗎？
    - generic [ref=e25]:
      - heading "👨‍👧 爸爸的工具，我幾乎把每條路都走過一遍" [level=2] [ref=e26]:
        - generic [ref=e27]: 👨‍👧
        - text: 爸爸的工具，我幾乎把每條路都走過一遍
      - generic [ref=e28]: 家庭私人測試版
      - paragraph [ref=e29]: 一開始做 Mac mini 本機網頁，接著把介面改成手機可以直接開啟的「歌來囉 ♫」。中間也研究過 Tailscale、付費雲端、API 和 Telegram，繞了一大圈，最後採用的其實還是手機網址。
      - paragraph [ref=e30]: 你可能會問：有需要繞這麼大一圈嗎？
      - paragraph [ref=e31]: 有。因為「工程師覺得可以用」，跟「爸爸真的會用」，完全是兩回事。
      - paragraph [ref=e32]: Tailscale 技術上很漂亮，但只要斷線，爸爸就不知道要去哪裡重連。付費雲端當然也能做，可是為了下載幾支家庭影片，還要背一張不知道什麼時候會跳出來的帳單，我不要。
      - paragraph [ref=e33]: Telegram 我們也真的測成功過，但最後沒有拿它當爸爸的正式入口。第一版先定案成「歌來囉 ♫」手機網頁，畫面上只留下爸爸需要的東西。
      - list [ref=e34]:
        - listitem [ref=e35]: 📱爸爸用手機打開「歌來囉 ♫」專用網址
        - listitem [ref=e36]: 🔗貼上 YouTube 網址，按「開始轉換影片」
        - listitem [ref=e37]: 🖥️Mac mini 自己轉成 MP4，完成後手機頁面直接出現下載檔
      - paragraph [ref=e38]: 我已經真的用手機貼過網址、按下轉換，也真的看到 MP4 出現讓我下載。這才是現在要交給爸爸的版本。
      - generic [ref=e39]: 因為影片涉及著作權，這個工具只限我們家自己使用，無法公開分享工具網址。
      - paragraph [ref=e40]: 最後一關，是讓爸爸在自己的 Galaxy A56 從頭走一次。所以這裡我仍然寫「家庭私人測試版」。可以跑，不等於爸爸已經親自驗收，這次我記得很清楚。
    - generic [ref=e41]:
      - heading "🎤 KTV 這條更折騰，最難的竟然不是去人聲" [level=2] [ref=e42]:
        - generic [ref=e43]: 🎤
        - text: KTV 這條更折騰，最難的竟然不是去人聲
      - generic [ref=e44]: 公開測試版
      - paragraph [ref=e45]: 原本我以為，去人聲應該是最難的。
      - paragraph [ref=e46]: 結果真正把我們折騰最久的，是字幕。
      - paragraph [ref=e47]:
        - text: 一開始做 LRC，後來才知道美華 KTV 根本不要 LRC，它要的是 TXT。時間格式也不是隨便有時分秒就好，而是要長得像這樣：
        - strong [ref=e48]: "[03:46.20]站在零下三度"
        - text: 。
      - paragraph [ref=e49]: 更麻煩的是，OCR 有抓到字，不代表那些字能用。衣服上的英文、畫面標語、同一句歌詞逐字長出來的半句，全都會混進去。檔案產生得很順，打開卻是一團亂。
      - paragraph [ref=e50]: 所以整條流程最後被我改成：先用原唱影片把字幕時間校好，確認 TXT 通過，再去跑最花時間的人聲分離。
      - generic [ref=e51]:
        - generic [ref=e52]:
          - generic [ref=e53]: "1"
          - generic [ref=e54]:
            - text: 家人只管貼網址
            - generic [ref=e55]: 有自己的歌詞，也可以一起貼進去。
        - generic [ref=e56]:
          - generic [ref=e57]: "2"
          - generic [ref=e58]:
