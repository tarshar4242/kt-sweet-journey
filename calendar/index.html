<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>四葉草行事曆</title>
<meta name="theme-color" content="#b79fe8">
<meta name="description" content="拍照辨識會議通知，四葉草陪你排程">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="四葉草行事曆">
<style>
  :root{
    --mint:#7ed6a0; --mint-deep:#4fb87a; --gold:#ffcf7a;
    --coral:#f4a98d; --lav:#bda6ec; --lav-deep:#9d81dd; --pink:#f6a9cf;
    --accent1:#c3aef0; --accent2:#9d81dd;
    --text:#403a58; --muted:#918aa6;
    --card:#ffffff; --card-brd:rgba(150,120,180,.12); --evt-bg:#fbf8fd;
    --silk1:#cbb6f2; --silk2:#b79fe8; --silk3:#e9d9f6; --silk-op:1; --star-op:0;
    --fs:16px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html{ font-size:var(--fs); }
  body{
    font-family:-apple-system,'PingFang TC','Noto Sans TC',sans-serif; color:var(--text);
    min-height:100dvh; padding-bottom:92px; position:relative; overflow-x:hidden;
    background:radial-gradient(72% 46% at 100% 0%, rgba(170,142,230,.34), transparent 60%),radial-gradient(58% 40% at 0% 6%, rgba(197,178,240,.28), transparent 60%),radial-gradient(85% 52% at 88% 100%, rgba(157,129,221,.24), transparent 60%),radial-gradient(40% 30% at 6% 92%, rgba(244,169,141,.14), transparent 60%),linear-gradient(180deg,#fbf9ff 0%, #f7f4fc 100%);
    background-attachment:fixed;
  }
  .silk,.stars{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .silk{ opacity:var(--silk-op); }
  .stars{ opacity:var(--star-op); }
  .stars i{ position:absolute; background:#fff; border-radius:50%; animation:tw 3s infinite ease-in-out; }
  @keyframes tw{ 0%,100%{opacity:.3} 50%{opacity:.9} }
  main{ position:relative; z-index:1; max-width:640px; margin:0 auto; padding:0 16px; }

  button,input,select,textarea{ font-family:inherit; font-size:1rem; color:inherit; }
  button{ cursor:pointer; border:none; background:none; }
  a{ color:var(--lav-deep); }
  .grad{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); }
  .grad-txt{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .card{ background:var(--card); border:1px solid var(--card-brd); border-radius:24px; box-shadow:0 10px 30px rgba(120,90,160,.12),0 2px 8px rgba(120,90,160,.05); }
  .muted{ color:var(--muted); }
  .icon{ width:26px; height:26px; display:inline-block; vertical-align:middle; }
  .hidden{ display:none !important; }

  /* 標題 */
  .ptitle{ font-size:1.42rem; font-weight:800; padding:20px 4px 14px; letter-spacing:.5px; }
  .slabel{ font-size:.82rem; font-weight:700; color:var(--muted); margin-bottom:.55rem; letter-spacing:.4px; }

  /* 問候 */
  .greet{ display:flex; align-items:center; gap:14px; padding:20px 6px 16px; }
  .mascot{ width:66px; height:66px; flex:none; filter:drop-shadow(0 6px 12px rgba(126,214,160,.4)); animation:float 4s ease-in-out infinite; }
  @keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .greet .hi{ font-size:.9rem; color:var(--lav-deep); font-weight:800; letter-spacing:.6px; }
  .greet .sub{ font-size:.74rem; color:var(--muted); font-weight:600; margin:2px 0 3px; }
  .greet .big{ font-size:1.24rem; font-weight:800; }
  .greet .big b{ font-weight:800; }
  .greet .sun{ margin-left:auto; width:36px; height:36px; flex:none; }

  /* 月曆 */
  .cal{ padding:16px 14px 18px; margin-bottom:16px; }
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; padding:0 4px; }
  .cal-head .m{ font-size:1.12rem; font-weight:800; }
  .cal-head button{ width:36px; height:36px; border-radius:50%; background:rgba(157,129,221,.14); color:var(--lav-deep); font-size:1.2rem; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .wd{ text-align:center; font-size:.7rem; color:var(--muted); padding:4px 0 8px; font-weight:700; }
  .cell{ aspect-ratio:1/1; border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:.9rem; font-weight:700; color:var(--text); position:relative; }
  .cell.other{ color:#c9c2d6; font-weight:500; }
  .cell.today .n{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; box-shadow:0 4px 12px rgba(157,129,221,.5); }
  .cell.sel:not(.today){ background:rgba(157,129,221,.12); }
  .dots{ display:flex; gap:3px; height:6px; }
  .dots i{ width:6px; height:6px; border-radius:50%; display:block; }

  /* 行程卡 */
  .day{ padding:16px; }
  .day h3{ font-size:.98rem; margin-bottom:12px; display:flex; align-items:center; gap:8px; font-weight:800; }
  .day h3 .tag{ font-size:.7rem; color:var(--muted); font-weight:600; }
  .evt{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:16px; background:var(--evt-bg); border:1px solid var(--card-brd); margin-bottom:10px; }
  .evt .bar{ width:4px; align-self:stretch; border-radius:4px; flex:none; min-height:34px; }
  .evt .t{ font-weight:700; font-size:.98rem; }
  .evt .meta{ font-size:.8rem; color:var(--muted); margin-top:2px; line-height:1.6; }
  .date-group{ font-size:.82rem; font-weight:800; color:var(--lav-deep); margin:16px 4px 8px; }
  .empty{ text-align:center; padding:26px 12px; }
  .empty .m2{ width:96px; height:96px; margin:0 auto 10px; animation:float 4s ease-in-out infinite; }
  .empty p{ color:var(--muted); font-size:.92rem; margin-bottom:14px; }
  .btn-grad{ display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; font-weight:800; padding:12px 22px; border-radius:999px; box-shadow:0 8px 20px rgba(157,129,221,.4); }
  .btn-soft{ display:inline-flex; align-items:center; justify-content:center; gap:8px; background:var(--card); color:var(--text); border:1px solid var(--card-brd); font-weight:700; padding:11px 18px; border-radius:16px; }
  .btn-grad:disabled,.btn-soft:disabled{ opacity:.55; }
  .w100{ width:100%; }

  /* 表單 */
  label.field{ display:block; margin-bottom:.9rem; }
  label.field>span{ display:block; font-size:.85rem; font-weight:700; margin-bottom:.35rem; }
  input,select,textarea{ width:100%; background:var(--evt-bg); border:1px solid var(--card-brd); border-radius:14px; padding:.7rem .85rem; }
  input:focus,select:focus,textarea:focus{ outline:2px solid var(--lav); outline-offset:-1px; }
  textarea{ min-height:80px; resize:vertical; }
  .row{ display:flex; gap:.6rem; }
  .grow{ flex:1; }
  .seg{ display:flex; gap:.45rem; margin-bottom:1rem; }
  .seg button{ flex:1; border:1px solid var(--card-brd); border-radius:14px; padding:.6rem; font-size:.9rem; font-weight:700; background:var(--card); color:var(--muted); display:flex; align-items:center; justify-content:center; gap:5px; }
  .seg button.on{ border-color:transparent; background:linear-gradient(135deg,var(--accent1),var(--accent2)); color:#fff; }
  .prio{ display:flex; gap:.45rem; }
  .prio button{ flex:1; border:2px solid var(--card-brd); border-radius:14px; padding:.55rem; font-size:.85rem; font-weight:700; background:var(--card); }
  .prio button.on{ border-color:var(--lav-deep); background:rgba(157,129,221,.08); }
  .prio .d{ width:.7rem; height:.7rem; border-radius:50%; display:inline-block; vertical-align:-1px; margin-right:.3rem; }

  /* 設定 */
  .set-sec{ margin-bottom:1.4rem; }
  .badge{ display:inline-flex; align-items:center; padding:.2rem .7rem; border-radius:999px; font-size:.75rem; font-weight:700; }
  .b-green{ background:rgba(126,214,160,.22); color:#2f7a52; } .b-amber{ background:rgba(255,207,122,.28); color:#8a6a1e; }
  .b-info{ background:rgba(157,129,221,.16); color:var(--lav-deep); }
  .theme-card{ width:100%; text-align:left; border:2px solid var(--card-brd); border-radius:18px; padding:.85rem 1rem; margin-bottom:.55rem; background:var(--card); display:flex; align-items:center; gap:12px; }
  .theme-card .prev{ width:40px; height:40px; border-radius:12px; flex:none; border:1px solid rgba(0,0,0,.06); }
  .theme-card b{ font-size:.98rem; } .theme-card .d2{ font-size:.76rem; color:var(--muted); margin-top:1px; }
  .list-note{ font-size:.83rem; color:var(--muted); line-height:1.75; }
  .list-note li{ margin-left:1.1rem; margin-bottom:.25rem; }

  /* 底部導覽 */
  nav{ position:fixed; bottom:0; left:0; right:0; z-index:20; display:flex; justify-content:space-around; align-items:flex-end;
    padding:8px 10px calc(10px + env(safe-area-inset-bottom));
    background:var(--card); border-top:1px solid var(--card-brd); }
  html[data-dark] nav{ background:rgba(20,22,43,.86); backdrop-filter:blur(12px); }
  nav button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:.66rem; font-weight:700; }
  nav button.on{ color:var(--lav-deep); }
  nav button svg{ width:26px; height:26px; }
  nav .fab{ flex:none; margin:0 6px; transform:translateY(-14px); }
  nav .fab .c{ width:60px; height:60px; border-radius:50%; background:linear-gradient(135deg,var(--accent1),var(--accent2)); display:flex; align-items:center; justify-content:center; box-shadow:0 10px 24px rgba(157,129,221,.5); }
  nav .fab .c svg{ width:30px; height:30px; color:#fff; }

  /* Modal / toast */
  .modal-bg{ position:fixed; inset:0; background:rgba(60,45,90,.4); z-index:40; display:none; align-items:flex-end; justify-content:center; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--card); width:100%; max-width:640px; border-radius:24px 24px 0 0; padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom)); max-height:88dvh; overflow:auto; }
  .toast{ position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--lav-deep); color:#fff; padding:.65rem 1.1rem; border-radius:14px; font-size:.85rem; z-index:60; opacity:0; transition:opacity .2s; max-width:90%; text-align:center; white-space:pre-line; box-shadow:0 8px 24px rgba(120,90,160,.4); }
  .toast.show{ opacity:.97; }
  .home-fab{ position:fixed; top:12px; left:12px; z-index:30; width:2.3rem; height:2.3rem; border-radius:50%; background:var(--card); border:1px solid var(--card-brd); box-shadow:0 4px 12px rgba(120,90,160,.2); display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:1.1rem; opacity:.9; }
  @media (display-mode:standalone){ .home-fab{ display:none; } }
</style>
</head>
<body>
<a class="home-fab" href="../#life" title="回筆記館入口">🏠</a>
<svg class="silk" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
  <defs><filter id="blur"><feGaussianBlur stdDeviation="14"/></filter></defs>
  <g filter="url(#blur)" fill="none" stroke-linecap="round">
    <path d="M-40 60 C 120 10 260 120 460 30" style="stroke:var(--silk2)" stroke-width="46" opacity=".55"/>
    <path d="M-40 110 C 130 70 250 180 460 90" style="stroke:var(--silk3)" stroke-width="30" opacity=".4"/>
    <path d="M-60 760 C 120 700 240 850 470 770" style="stroke:var(--silk2)" stroke-width="52" opacity=".45"/>
    <path d="M-60 810 C 130 760 260 880 470 820" style="stroke:var(--silk1)" stroke-width="34" opacity=".38"/>
    <path d="M-40 250 C 60 220 120 300 40 360" style="stroke:var(--silk1)" stroke-width="26" opacity=".26"/>
  </g>
</svg>
<div class="stars" id="stars"></div>

<!-- 定義：四葉草精靈 + 圖示漸層 -->
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="clg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6f0b8"/><stop offset="1" stop-color="#5fc98a"/></linearGradient>
  <symbol id="sprite" viewBox="0 0 100 100">
    <path d="M50 54 Q47 74 38 83" stroke="#4fb87a" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <g fill="url(#clg)">
      <path d="M0 0 C -16 -14 -18 -33 -8 -33 C -3 -33 0 -29 0 -26 C 0 -29 3 -33 8 -33 C 18 -33 16 -14 0 0 Z" transform="translate(50 50) rotate(0)"/>
      <path d="M0 0 C -16 -14 -18 -33 -8 -33 C -3 -33 0 -29 0 -26 C 0 -29 3 -33 8 -33 C 18 -33 16 -14 0 0 Z" transform="translate(50 50) rotate(90)"/>
      <path d="M0 0 C -16 -14 -18 -33 -8 -33 C -3 -33 0 -29 0 -26 C 0 -29 3 -33 8 -33 C 18 -33 16 -14 0 0 Z" transform="translate(50 50) rotate(180)"/>
      <path d="M0 0 C -16 -14 -18 -33 -8 -33 C -3 -33 0 -29 0 -26 C 0 -29 3 -33 8 -33 C 18 -33 16 -14 0 0 Z" transform="translate(50 50) rotate(270)"/>
    </g>
    <circle cx="43.5" cy="51" r="3.2" fill="#20362a"/><circle cx="56.5" cy="51" r="3.2" fill="#20362a"/>
    <circle cx="44.7" cy="49.9" r=".9" fill="#fff"/><circle cx="57.7" cy="49.9" r=".9" fill="#fff"/>
    <path d="M46.5 56 Q50 59.5 53.5 56" stroke="#20362a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="38.5" cy="55" r="2.7" fill="#f7b8d6" opacity=".8"/><circle cx="61.5" cy="55" r="2.7" fill="#f7b8d6" opacity=".8"/>
    <path d="M80 20 l1.6 3.6 3.9.4-2.9 2.6.8 3.8-3.4-2-3.4 2 .8-3.8-2.9-2.6 3.9-.4z" fill="#ffcf7a"/>
  </symbol>
</defs></svg>

<main>
  <!-- 月曆 -->
  <section id="v-cal" class="view">
    <div class="greet">
      <svg class="mascot"><use href="#sprite"/></svg>
      <div class="grow">
        <div class="hi" id="g-poem"></div>
        <div class="sub" id="g-date"></div>
        <div class="big" id="g-count"></div>
      </div>
      <svg class="sun" id="g-orb" viewBox="0 0 24 24"></svg>
    </div>
    <section class="card cal">
      <div class="cal-head"><button id="cal-prev">‹</button><div class="m" id="cal-month"></div><button id="cal-next">›</button></div>
      <div class="grid" id="cal-grid"></div>
    </section>
    <div id="cal-day"></div>
  </section>

  <!-- 清單 -->
  <section id="v-list" class="view">
    <div class="ptitle">近期行程</div>
    <div id="list-body"></div>
  </section>

  <!-- 新增 -->
  <section id="v-add" class="view">
    <div class="ptitle" id="add-title">新增行程</div>
    <div class="seg" id="add-mode">
      <button data-m="manual" class="on">✍️ 手動</button>
      <button data-m="paste">📋 貼文字</button>
      <button data-m="photo">📸 拍照</button>
    </div>
    <div id="pane-paste" class="hidden" style="margin-bottom:1rem">
      <label class="field"><span>貼上會議／活動文字，自動抓出時間地點</span>
        <textarea id="paste-text" placeholder="例如：3/15 下午2點 在 302 會議室 開產品週會"></textarea></label>
      <button class="btn-grad w100" id="paste-parse">解析文字</button>
    </div>
    <div id="pane-photo" class="hidden" style="margin-bottom:1rem">
      <p class="list-note" style="margin-bottom:.6rem">拍或選一張會議通知單，AI 自動辨識。需先到「設定」填入自己的 AI 金鑰（免費申請）。</p>
      <input type="file" id="photo-file" accept="image/*" capture="environment" style="margin-bottom:.6rem">
      <button class="btn-grad w100" id="photo-run">辨識照片</button>
      <p id="photo-status" class="list-note" style="margin-top:.6rem"></p>
    </div>
    <form id="evt-form">
      <input type="hidden" id="f-id">
      <label class="field"><span>標題 *</span><input id="f-title" required placeholder="會議／行程名稱"></label>
      <label class="field"><span>日期 *</span><input type="date" id="f-date" required></label>
      <div class="row">
        <label class="field grow"><span>開始</span><input type="time" id="f-start"></label>
        <label class="field grow"><span>結束</span><input type="time" id="f-end"></label>
      </div>
      <label class="field"><span>地點</span><input id="f-loc" placeholder="會議室／地址"></label>
      <label class="field"><span>備註</span><textarea id="f-notes"></textarea></label>
      <label class="field"><span>重要程度</span>
        <div class="prio" id="f-prio">
          <button type="button" data-v="high"><span class="d" style="background:#DC2626"></span>最重要</button>
          <button type="button" data-v="medium" class="on"><span class="d" style="background:#EAB308"></span>中等</button>
          <button type="button" data-v="low"><span class="d" style="background:#16A34A"></span>普通</button>
        </div></label>
      <label class="field"><span>提醒</span>
        <select id="f-remind"><option value="0">不提醒</option><option value="5">5 分鐘前</option><option value="15">15 分鐘前</option><option value="30">30 分鐘前</option><option value="60">60 分鐘前</option></select></label>
      <div class="row" style="margin-top:.3rem">
        <button type="submit" class="btn-grad grow">儲存行程</button>
        <button type="button" id="f-delete" class="btn-soft hidden">刪除</button>
      </div>
    </form>
  </section>

  <!-- 設定 -->
  <section id="v-set" class="view"><div id="set-body"></div></section>
</main>

<nav>
  <button data-v="v-cal" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="4"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/><circle cx="8.5" cy="14" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>月曆</button>
  <button data-v="v-list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="3.6" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.6" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.6" cy="18" r="1.3" fill="currentColor" stroke="none"/></svg>清單</button>
  <button data-v="v-add" class="fab"><span class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-v="v-set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 4.5h.1A1.7 1.7 0 0 0 10 3V2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/><circle cx="12" cy="12" r="3"/></svg>設定</button>
</nav>

<div class="modal-bg" id="modal-bg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ===== 常數 ===== */
const DB_NAME="clover-cal",STORE="events",PREFS_KEY="clover-cal-prefs",BACKUP_KEY="clover-cal-backup";
const BACKUP_MAX_BYTES=0xa00000,MAX_EVENTS=5000,TITLE_MAX=200,LOC_MAX=200,NOTES_MAX=4000,REMIND_MAX=10080;
const PRIO={high:{label:"最重要",hex:"#DC2626"},medium:{label:"中等",hex:"#EAB308"},low:{label:"普通",hex:"#16A34A"}};
const SRC2P={high:"high",medium:"medium",low:"low",meeting:"high",travel:"medium",personal:"low",other:"low"};
const VALID_SRC=new Set(["ocr","manual","booking","paste"]);
const THEMES=[

function localParse(txt){const lines=txt.split(/\n/).map(s=>s.trim()).filter(Boolean);const title=(lines[0]||"新行程").slice(0,TITLE_MAX);let y=new Date().getFullYear(),mo=null,da=null;let md=txt.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/)||txt.match(/(\d{1,2})[\/月](\d{1,2})/);if(md){if(md.length===4){y=+md[1];mo=+md[2];da=+md[3];}else{mo=+md[1];da=+md[2];}}if(/今天/.test(txt)){const d=new Date();mo=d.getMonth()+1;da=d.getDate();}if(/明天/.test(txt)){const d=new Date(Date.now()+86400000);mo=d.getMonth()+1;da=d.getDate();}let hh=null,mm=0;const tm=txt.match(/(上午|下午|早上|晚上)?\s*(\d{1,2})[:：點時](\d{0,2})/);if(tm){hh=+tm[2];mm=tm[3]?+tm[3]:0;if(/(下午|晚上)/.test(tm[1]||"")&&hh<12)hh+=12;}const loc=(txt.match(/(?:在|地點[:：]?|＠|@)\s*([^\n，,。;；]{1,40})/)||[])[1]||"";return{title,date:(mo&&da)?`${y}-${pad(mo)}-${pad(da)}`:twToday(),start:hh!=null?`${pad(hh)}:${pad(mm)}`:"",end:"",location:loc.trim(),notes:""};}

  <section class="card" style="padding:1rem;margin-bottom:1.4rem">
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem"><span>🔑</span><b>AI 辨識金鑰（拍照辨識）</b></div>
    <p class="list-note" style="margin-bottom:.7rem">填入自己的 Google AI 金鑰即可拍照辨識，<b>不限次數</b>。金鑰只存在這台裝置，不外傳。未填也能手動新增、貼文字解析（不花錢）。</p>
    <span class="badge ${keySet?'b-green':'b-amber'}">${keySet?'已設定 · 辨識不限次數':'未設定 · 拍照需金鑰'}</span>
    <label class="field" style="margin-top:.8rem"><span>API Key</span>
      <div style="position:relative"><input id="s-key" type="password" value="${esc(p.geminiApiKey)}" placeholder="貼上 AIza... 開頭的金鑰" autocomplete="off" spellcheck="false" style="font-family:monospace;padding-right:2.6rem">
      <button id="s-key-eye" type="button" style="position:absolute;right:.6rem;top:50%;transform:translateY(-50%)">👁</button></div></label>
    <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener noreferrer" class="list-note" style="display:inline-block;margin-bottom:.6rem">前往 Google AI Studio 免費申請金鑰 →</a>
    <div class="row"><button id="s-key-save" class="btn-grad grow">儲存金鑰</button>${keySet?'<button id="s-key-clear" class="btn-soft">清除</button>':''}</div>
  </section>

  <div class="set-sec"><div class="slabel">外觀主題</div>
    ${THEMES.map(t=>`<button class="theme-card" data-theme="${t.id}" style="${t.id===p.themeId?'border-color:'+t.accent2:''}"><span class="prev" style="background:${t.prev}"></span><span class="grow"><b>${t.name}</b><span class="d2">${t.desc}</span></span>${t.id===p.themeId?'<span class="badge b-info">使用中</span>':''}</button>`).join("")}
  </div>

  <div class="set-sec"><div class="slabel">字體大小</div>
    <div class="seg">${["sm","md","lg"].map(s=>`<button data-fs="${s}" class="${p.fontScale===s?'on':''}">${s==='sm'?'小':s==='md'?'中':'大'}</button>`).join("")}</div>
  </div>

  <div class="set-sec"><div class="slabel">預設提醒</div>
    <select id="s-remind" ${p.notificationMode!=='allowed'?'disabled':''}>${[5,15,30,60].map(n=>`<option value="${n}" ${p.defaultReminderMinutes===n?'selected':''}>新行程預設 ${n} 分鐘前提醒</option>`).join("")}</select>
    <section class="card" style="padding:1rem;margin-top:.7rem">
      <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem"><b>行程提醒</b> <span class="badge ${p.notificationMode==='allowed'?'b-green':'b-amber'}">${p.notificationMode==='allowed'?'已允許':p.notificationMode==='blocked'?'已封鎖':'尚未設定'}</span></div>
      <p class="list-note" style="margin-bottom:.6rem">${p.notificationMode==='allowed'?'已開啟提醒。若瀏覽器詢問請點「允許」。':p.notificationMode==='blocked'?'已關閉提醒，不會收到任何通知。':'尚未啟用提醒。選「已允許」即可開始使用。'}</p>
      <div class="seg">${[["allowed","已允許"],["blocked","已封鎖"],["unset","尚未設定"]].map(([v,l])=>`<button data-nm="${v}" class="${p.notificationMode===v?'on':''}">${l}</button>`).join("")}</div>
    </section>
  </div>

  <div class="set-sec"><div class="slabel">匯出行事曆</div>
    <select id="s-cal"><option value="outlook" ${p.primaryCalendar==='outlook'?'selected':''}>企業郵件行事曆（.ics）</option><option value="google" ${p.primaryCalendar==='google'?'selected':''}>雲端行事曆（.ics）</option><option value="app_only" ${p.primaryCalendar==='app_only'?'selected':''}>僅保留在本 App</option></select>
    <ul class="list-note" style="margin-top:.5rem"><li>匯出 .ics 後可用手機日曆或 Outlook 開啟加入</li><li>公司會議建議 Outlook，個人行程可選雲端行事曆</li></ul>
  </div>

  <div class="set-sec">${state.events.length?`<button id="s-export" class="btn-grad w100" style="margin-bottom:.5rem">⬇️ 匯出全部行程（.ics）</button><button id="s-share" class="btn-soft w100">🔗 分享行程文字</button>`:`<section class="card day"><div class="empty" style="padding:18px"><p>尚無行程可匯出，先新增會議吧 🍀</p></div></section>`}</div>

  <section class="card" style="padding:1rem;margin-bottom:1.4rem">
    <b>裝置同步（A → B）</b>
    <p class="list-note" style="margin:.4rem 0 .7rem">資料不上雲。A 裝置匯出後，B 裝置匯入本機資料庫完成合併。</p>
    <div class="slabel">A 裝置：匯出</div>
    <button id="s-bk-save" class="btn-grad w100" style="margin-bottom:.4rem">💾 儲存到本機備份庫（${state.events.length} 場）</button>
    <button id="s-bk-dl" class="btn-soft w100" style="margin-bottom:.9rem">📄 下載備份檔（跨裝置傳輸）</button>
    <div class="slabel">B 裝置：匯入</div>
    <p class="list-note" style="margin-bottom:.4rem">${backupInfo()}</p>
    <button id="s-bk-local" class="btn-grad w100" style="margin-bottom:.4rem" ${localStorage.getItem(BACKUP_KEY)?'':'disabled'}>📥 從本機備份庫匯入</button>
    <input type="file" id="s-bk-file" accept=".json,application/json" class="hidden">
    <button id="s-bk-pick" class="btn-soft w100">📂 選擇備份檔匯入</button>
  </section>

  <section class="card" style="padding:1rem;margin-bottom:1.4rem">
    <p class="list-note">行程資料儲存在此裝置瀏覽器（IndexedDB），不會上傳雲端。這也代表：換瀏覽器或清除資料前，記得先用上方「裝置同步」備份。</p>
  </section>

  <section class="card" style="padding:1rem">
    <b>關於</b>
    <p class="list-note" style="margin-top:.4rem">四葉草行事曆 🍀｜拍照辨識、本機行程、匯出行事曆。單一檔案、免安裝、離線可用、記行程完全免費。</p>
    <p class="list-note" style="margin-top:.5rem"><a href="#" id="s-install">📲 如何安裝到手機主畫面</a></p>
  </section>`;
  bindSettings();
}
function backupInfo(){const raw=localStorage.getItem(BACKUP_KEY);if(!raw)return "本機備份庫尚無資料；跨裝置請先從 A 傳備份檔到此裝置";try{const b=JSON.parse(raw);return `本機備份庫：${b.events.length} 場 · ${b.exportedAt?fmtFull(b.exportedAt).slice(5):''}`;}catch(e){return "本機備份庫資料異常";}}
function bindSettings(){
  const p=state.prefs;
  $("#s-key-eye").onclick=()=>{const i=$("#s-key");i.type=i.type==="password"?"text":"password";};
  $("#s-key-save").onclick=()=>{p.geminiApiKey=$("#s-key").value.trim();savePrefs(p);toast("已儲存金鑰 🍀");renderSettings();};
  $("#s-key-clear")&&($("#s-key-clear").onclick=()=>{p.geminiApiKey="";savePrefs(p);toast("已清除");renderSettings();});
  $$("[data-theme]").forEach(b=>b.onclick=()=>{p.themeId=b.dataset.theme;savePrefs(p);applyTheme();renderSettings();});
  $$("[data-fs]").forEach(b=>b.onclick=()=>{p.fontScale=b.dataset.fs;savePrefs(p);applyTheme();renderSettings();});
  $("#s-remind")&&($("#s-remind").onchange=e=>{p.defaultReminderMinutes=Number(e.target.value);savePrefs(p);});
  $$("[data-nm]").forEach(b=>b.onclick=async()=>{const v=b.dataset.nm;if(v==="allowed")await reqNotify();p.notificationMode=v;savePrefs(p);scheduleAll();renderSettings();});
  $("#s-cal").onchange=e=>{p.primaryCalendar=e.target.value;savePrefs(p);};
  $("#s-export")&&($("#s-export").onclick=()=>exportICS(state.events));
  $("#s-share")&&($("#s-share").onclick=()=>shareText(state.events));
  $("#s-bk-save").onclick=()=>{const b=makeBackup(state.events);localStorage.setItem(BACKUP_KEY,JSON.stringify(b));toast(`已存到本機備份庫（${b.events.length} 場）`);renderSettings();};
  $("#s-bk-dl").onclick=()=>{if(!state.events.length){toast("目前沒有行程可匯出");return;}downloadBackup(state.events);};
  $("#s-bk-local")&&($("#s-bk-local").onclick=async()=>{const raw=localStorage.getItem(BACKUP_KEY);if(!raw){toast("本機備份庫尚無資料");return;}await importBackupText(raw);});
  $("#s-bk-pick").onclick=()=>$("#s-bk-file").click();
  $("#s-bk-file").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>BACKUP_MAX_BYTES){toast("檔案過大（上限 10MB）");return;}const txt=await f.text();localStorage.setItem(BACKUP_KEY,txt);await importBackupText(txt);e.target.value="";};
  $("#s-install").onclick=ev=>{ev.preventDefault();toast("iPhone：Safari 分享 → 加入主畫面\nAndroid：瀏覽器選單 → 安裝應用程式");};
}

/* ===== 備份 ===== */
function makeBackup(events){return{version:1,app:"clover-cal",exportedAt:nowISO(),events:[...events].sort((a,b)=>new Date(a.startAt)-new Date(b.startAt))};}
function downloadBackup(events){const b=makeBackup(events),d=new Date(),name=`clover-cal-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`,blob=new Blob([JSON.stringify(b,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url);toast(`已下載備份檔（${b.events.length} 場）`);}
function parseBackup(text){let t;try{t=JSON.parse(text);}catch(e){return{ok:false,error:"檔案不是有效的 JSON"};}if(!t||typeof t!=="object")return{ok:false,error:"備份檔格式不正確"};if(t.app!=="clover-cal")return{ok:false,error:"這不是本 App 的備份檔"};if(t.version!==1)return{ok:false,error:"不支援的備份版本"};if(!Array.isArray(t.events))return{ok:false,error:"備份檔缺少行程資料"};if(t.events.length>MAX_EVENTS)return{ok:false,error:"備份檔筆數過多（上限 5000）"};const out=[];let invalid=0;for(const e of t.events){if(!e||typeof e!=="object"||!e.id||!e.title||isNaN(new Date(e.startAt))||isNaN(new Date(e.endAt))){invalid++;continue;}out.push(sanitizeEvent(e));}if(out.length===0&&t.events.length>0)return{ok:false,error:"備份檔內的行程資料無法辨識"};return{ok:true,backup:{version:1,app:"clover-cal",exportedAt:t.exportedAt||nowISO(),events:out},invalid};}
function diff(backup,current){const map=new Map(current.map(e=>[e.id,e])),toAdd=[],toUpdate=[];let skipped=0;for(const e of backup.events){const cur=map.get(e.id);if(!cur){toAdd.push(e);continue;}const a=new Date(cur.updatedAt).getTime(),b=new Date(e.updatedAt).getTime();if(b>a)toUpdate.push(e);else if(b===a){const same=["title","startAt","endAt","location","notes","color","reminderMinutes"].every(k=>cur[k]===e[k]);same?skipped++:toUpdate.push(e);}else skipped++;}return{toAdd,toUpdate,skipped};}
async function importBackupText(text){const r=parseBackup(text);if(!r.ok){toast(r.error);return;}const d=diff(r.backup,state.events);if(d.toAdd.length===0&&d.toUpdate.length===0){toast("本機資料已是最新，無需匯入"+(r.invalid?`\n另有 ${r.invalid} 筆格式錯誤已略過`:""));return;}if(!confirm(`確認匯入？\n新增 ${d.toAdd.length} 場\n更新 ${d.toUpdate.length} 場${d.skipped?`\n略過 ${d.skipped} 場（本機較新）`:""}\n（不會刪除本機獨有的行程）`))return;for(const e of[...d.toAdd,...d.toUpdate])await dbPut(e);await reload();renderSettings();toast(`已匯入：新增 ${d.toAdd.length}、更新 ${d.toUpdate.length}`);}

/* ===== .ics / 分享 ===== */
function icsEsc(s){return(s||"").replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");}
function icsDate(iso){const d=new Date(iso);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;}
function buildICS(events){let l=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//clover-cal//TW//ZH","CALSCALE:GREGORIAN"];for(const e of events){l.push("BEGIN:VEVENT","UID:"+icsEsc(e.id)+"@clover-cal","DTSTAMP:"+icsDate(nowISO()),"DTSTART:"+icsDate(e.startAt),"DTEND:"+icsDate(e.endAt),"SUMMARY:"+icsEsc(e.title));if(e.location)l.push("LOCATION:"+icsEsc(e.location));if(e.notes)l.push("DESCRIPTION:"+icsEsc(e.notes));if(e.reminderMinutes>0)l.push("BEGIN:VALARM","ACTION:DISPLAY","TRIGGER:-PT"+e.reminderMinutes+"M","DESCRIPTION:行程提醒","END:VALARM");l.push("END:VEVENT");}l.push("END:VCALENDAR");return l.join("\r\n");}
function exportICS(events){if(!events.length){toast("目前沒有行程可匯出");return;}const blob=new Blob([buildICS(events)],{type:"text/calendar"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="行程.ics";a.click();URL.revokeObjectURL(url);toast(`已下載 .ics（${events.length} 場）`);}
function eventsToText(events){return events.slice().sort((a,b)=>new Date(a.startAt)-new Date(b.startAt)).map(e=>`📅 ${e.title}\n🕐 ${fmtFull(e.startAt)} ${fmtTime(e.startAt)}${e.location?"\n📍 "+e.location:""}`).join("\n\n");}
async function shareText(events){if(!events.length){toast("目前沒有行程可分享");return;}const text=eventsToText(events);if(navigator.share){try{await navigator.share({title:"我的行程",text});return;}catch(e){if(e.name==="AbortError")return;}}try{await navigator.clipboard.writeText(text);toast("已複製行程文字，可貼到即時通訊");}catch(e){prompt("複製以下文字：",text);}}

/* ===== 全部渲染 ===== */
function renderAll(){renderCal();if($("#v-list").classList.contains("active"))renderList();if($("#v-set").classList.contains("active"))renderSettings();}

/* ===== 星點 ===== */
(function(){let h="";for(let i=0;i<42;i++){h+=`<i style="left:${(i*37+13)%100}%;top:${(i*53+7)%72}%;width:${1+(i%3)}px;height:${1+(i%3)}px;animation-delay:${(i%30)/10}s"></i>`;}document.getElementById("stars").innerHTML=h;})();

/* ===== PWA manifest ===== */
(function(){try{
  const c=document.createElement("canvas");c.width=c.height=192;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,192,192);g.addColorStop(0,"#c3aef0");g.addColorStop(1,"#9d81dd");x.fillStyle=g;x.fillRect(0,0,192,192);
  x.font="120px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🍀",96,104);const icon=c.toDataURL("image/png");
  const man={name:"四葉草行事曆",short_name:"行事曆",start_url:".",display:"standalone",background_color:"#f7f4fc",theme_color:"#b79fe8",icons:[{src:icon,sizes:"192x192",type:"image/png"},{src:icon,sizes:"512x512",type:"image/png"}]};
  const link=document.createElement("link");link.rel="manifest";link.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:"application/manifest+json"}));document.head.appendChild(link);
  const ai=document.createElement("link");ai.rel="apple-touch-icon";ai.href=icon;document.head.appendChild(ai);
}catch(e){}})();

/* ===== 啟動 ===== */
applyTheme();
show("v-cal");
reload().then(()=>{if(state.prefs.notificationMode==="allowed")reqNotify();});
window.openAdd=openAdd;
</script>
</body>
</html>
