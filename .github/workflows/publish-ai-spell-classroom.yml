name: Publish to ai-spell-classroom

on:
  push:
    branches: [main]
    paths:
      - 'publish-ai-spell-classroom/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (this repo)
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout target (ai-spell-classroom.github.io)
        uses: actions/checkout@v4
        with:
          repository: ai-spell-classroom/ai-spell-classroom.github.io
          token: ${{ secrets.PUBLISH_TOKEN }}
          path: target

      - name: Sync published files into target repo
        # 不用 --delete：目標 repo 除了六頁教材，還有 協作交接/（三方交接與定版檔工作區）與 CLAUDE.md。
        # 2026-08-16 曾因 --delete 整個資料夾被鏡像刪除（已從 git 歷史還原）。要下架頁面請到目標 repo 手動刪。
        run: |
          rsync -av --exclude='.git' source/publish-ai-spell-classroom/ target/

      - name: Commit and push if changed
        run: |
          cd target
          git config user.name "ai-spell-classroom-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Sync from kt-sweet-journey publish-ai-spell-classroom/"
            git push
          fi
