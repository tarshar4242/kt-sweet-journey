<!DOCTYPE html>

<style>

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  a.card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;text-decoration:none;color:var(--ink)}

  a.card b{display:block;font-size:1.05rem}
  a.card span{font-size:.85rem;color:var(--sub)}
